name: Keymap viewer

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "docs/**"
      - "scripts/build-viewer.mjs"
      - "tests/**"
      - ".github/workflows/keymap-viewer.yml"
  pull_request:
    paths:
      - "config/**"
      - "docs/**"
      - "scripts/build-viewer.mjs"
      - "tests/**"
      - ".github/workflows/keymap-viewer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and package viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test ZMK keymap parser
        run: node --test tests/keymap-model.test.mjs
      - name: Check browser JavaScript syntax
        run: |
          node --check docs/app.mjs
          node --check docs/layout-model.mjs
      - name: Build static viewer
        run: node scripts/build-viewer.mjs
      - name: Attach downloadable preview
        uses: actions/upload-artifact@v4
        with:
          name: keymap-viewer-preview
          path: _site/
          include-hidden-files: true
          retention-days: 30

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare static site
        run: node scripts/build-viewer.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4
