name: Redirect legacy keymap viewer to unified explorer
on:
  push:
    branches: [main]
    paths:
      - "legacy-pages/**"
      - ".github/workflows/keymap-viewer.yml"
  pull_request:
    paths:
      - "legacy-pages/**"
      - ".github/workflows/keymap-viewer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify redirect points to canonical nice!60 viewer
        run: |
          test -s legacy-pages/index.html
          grep -Fq 'https://codymathis123.github.io/miryoku_zmk/#nice60' legacy-pages/index.html
          if grep -Eq '(keymap-model|app\.mjs|keymap\.keymap)' legacy-pages/index.html; then
            echo "Legacy viewer must only redirect to the canonical UI" >&2
            exit 1
          fi

  deploy:
    name: Publish redirect
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: legacy-keymap-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: legacy-pages/
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4
